name: staging-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-not-bypassed:
    name: public has nothing this repo is missing
    # Only meaningful on the staging repo. This file is fast-forwarded to the public
    # repo verbatim, and there the comparison target would be the repo itself: a daily
    # cron job on a participant-facing repository that can never fail. Skip it there.
    if: endsWith(github.repository, '-staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
      - name: Check the public repo was not edited directly
        run: ./scripts/check_public_sync.sh
